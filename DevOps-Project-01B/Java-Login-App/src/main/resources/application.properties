spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# Database connection — values are injected as environment variables at
# container runtime (see infrastructure/ec2.tf launch template user-data),
# which reads them out of the RDS-managed Secrets Manager secret
# (outputs.tf: rds_secret_arn). Nothing sensitive is hardcoded here or
# committed to the repository.
#
# Local/dev-only fallback defaults are provided after the ":" so the app
# can still start against a local MySQL instance without any env vars set
# (see "Running locally" below) — these defaults are NOT used in AWS.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appdb}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Health endpoint used by the ALB target group health check
# (infrastructure/alb.tf -> var.app_health_check_path, default "/actuator/health").
# Only "health" is exposed (not the full actuator surface), and details are
# hidden from the response body so the public ALB check doesn't leak
# internal state (DB connectivity, disk space, etc.) to unauthenticated callers.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Running locally:
#   docker run -e DB_HOST=localhost -e DB_PORT=3306 -e DB_NAME=appdb \
#     -e DB_USERNAME=root -e DB_PASSWORD=yourpassword -p 8080:8080 <image>